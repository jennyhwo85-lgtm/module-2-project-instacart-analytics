version: 2

models:
  - name: int_order_products
    description: Combined order-product records from prior and train datasets.

    columns:
      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: add_to_cart_order
        tests:
          - not_null

      - name: reordered
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: source_eval_set
        tests:
          - not_null
          - accepted_values:
              values: ['prior', 'train']