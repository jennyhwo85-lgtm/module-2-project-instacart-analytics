<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <style>
    .title{font:700 27px Arial;fill:#17324d}.section{font:700 18px Arial;fill:#17324d}.head{font:700 16px Arial;fill:#17324d}.body{font:13px Arial;fill:#263746}.note{font:12px Arial;fill:#557086}.box{stroke:#557086;stroke-width:1.5;rx:12}.source{fill:#eef3f7}.user{fill:#e7f4ff}.order{fill:#fff3d6}.product{fill:#e8f5e9}.limit{fill:#f8e8e8;stroke:#a85d5d;stroke-width:1.5;rx:12}.arrow{stroke:#557086;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#557086"/></marker></defs>
  <text x="700" y="40" text-anchor="middle" class="title">Instacart Feature Engineering Guide for EDA</text>
  <rect x="40" y="95" width="250" height="170" class="box source"/><text x="165" y="130" text-anchor="middle" class="head">Available source fields</text><text x="65" y="165" class="body">order_id, user_id, product_id</text><text x="65" y="187" class="body">order_number, order_dow</text><text x="65" y="209" class="body">order_hour_of_day</text><text x="65" y="231" class="body">days_since_prior_order</text><text x="65" y="253" class="body">add_to_cart_order, reordered</text>
  <rect x="350" y="95" width="300" height="250" class="box user"/><text x="500" y="130" text-anchor="middle" class="head">Customer features</text><text x="375" y="165" class="body">observed_order_count</text><text x="375" y="187" class="note">count distinct order_id per user</text><text x="375" y="220" class="body">observed_item_count</text><text x="375" y="242" class="note">count order-item rows per user</text><text x="375" y="275" class="body">reorder_rate</text><text x="375" y="297" class="note">reordered items ÷ observed items</text><text x="375" y="330" class="body">average_order_gap</text><text x="375" y="350" class="note">average days_since_prior_order</text>
  <rect x="720" y="95" width="300" height="250" class="box order"/><text x="870" y="130" text-anchor="middle" class="head">Order / basket features</text><text x="745" y="165" class="body">basket_size</text><text x="745" y="187" class="note">count product rows per order</text><text x="745" y="220" class="body">first_added_position</text><text x="745" y="242" class="note">minimum add_to_cart_order</text><text x="745" y="275" class="body">order_time_bucket</text><text x="745" y="297" class="note">morning / afternoon / evening</text><text x="745" y="330" class="body">repeat_order_flag</text><text x="745" y="350" class="note">order_number &gt; 1</text>
  <rect x="1090" y="95" width="270" height="250" class="box product"/><text x="1225" y="130" text-anchor="middle" class="head">Product features</text><text x="1115" y="165" class="body">item_order_count</text><text x="1115" y="187" class="note">number of observed order lines</text><text x="1115" y="220" class="body">product_reorder_rate</text><text x="1115" y="242" class="note">average reordered value</text><text x="1115" y="275" class="body">department / aisle demand</text><text x="1115" y="297" class="note">counts grouped by category</text><text x="1115" y="330" class="body">average_cart_position</text>
  <path d="M290 180 H350" class="arrow"/><path d="M290 210 H720" class="arrow"/><path d="M290 240 H1090" class="arrow"/>
  <rect x="180" y="455" width="1040" height="180" class="box limit"/><text x="700" y="495" text-anchor="middle" class="head">Do not claim unsupported features</text><text x="220" y="535" class="body">No price or quantity → do not calculate revenue, sales value, or units sold.</text><text x="220" y="565" class="body">No calendar date → do not claim true monthly or seasonal trends.</text><text x="220" y="595" class="body">Test features for nulls, valid ranges, and leakage before using them in analysis or ML.</text>
  <text x="700" y="700" text-anchor="middle" class="section">EDA sequence</text><text x="700" y="735" text-anchor="middle" class="body">Create features at the correct grain → validate them → summarise by user/order/product → visualise → translate into business implications.</text>
</svg>
