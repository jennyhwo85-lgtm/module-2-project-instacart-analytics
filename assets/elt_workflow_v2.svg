<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <style>.title{font:700 27px Arial;fill:#17324d}.step{font:700 16px Arial;fill:#17324d}.body{font:13px Arial;fill:#263746}.why{font:italic 12px Arial;fill:#557086}.box{fill:#f7fbff;stroke:#557086;stroke-width:1.5;rx:12}.gate{fill:#fff3d6;stroke:#a7791e;stroke-width:1.5;rx:12}.arrow{stroke:#557086;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#557086"/></marker></defs>
  <text x="750" y="40" text-anchor="middle" class="title">Team ELT Workflow: From CSV to Business Insight</text>
  <rect x="50" y="110" width="260" height="170" class="box"/><text x="180" y="145" text-anchor="middle" class="step">1. Prepare and ingest</text><text x="75" y="180" class="body">Place six CSV files in data/.</text><text x="75" y="205" class="body">Run scripts/ingest.py.</text><text x="75" y="240" class="why">Why: create a repeatable raw source.</text>
  <rect x="370" y="110" width="260" height="170" class="box"/><text x="500" y="145" text-anchor="middle" class="step">2. Define sources</text><text x="395" y="180" class="body">Map dbt source names to</text><text x="395" y="202" class="body">DuckDB raw tables in sources.yml.</text><text x="395" y="240" class="why">Why: make dependencies explicit.</text>
  <rect x="690" y="110" width="260" height="170" class="box"/><text x="820" y="145" text-anchor="middle" class="step">3. Standardise</text><text x="715" y="180" class="body">Build stg_* views.</text><text x="715" y="202" class="body">Cast types and preserve grain.</text><text x="715" y="240" class="why">Why: give every model a clean input.</text>
  <rect x="1010" y="110" width="260" height="170" class="box"/><text x="1140" y="145" text-anchor="middle" class="step">4. Integrate</text><text x="1035" y="180" class="body">Build int_* views.</text><text x="1035" y="202" class="body">Union and join related data.</text><text x="1035" y="240" class="why">Why: prepare reusable business grain.</text>
  <path d="M310 195 H370" class="arrow"/><path d="M630 195 H690" class="arrow"/><path d="M950 195 H1010" class="arrow"/>
  <rect x="1010" y="390" width="260" height="170" class="box"/><text x="1140" y="425" text-anchor="middle" class="step">5. Publish marts</text><text x="1035" y="460" class="body">Build dimensions and</text><text x="1035" y="482" class="body">fact_order_items as tables.</text><text x="1035" y="520" class="why">Why: stable analyst interface.</text>
  <rect x="690" y="390" width="260" height="170" class="gate"/><text x="820" y="425" text-anchor="middle" class="step">6. Test quality</text><text x="715" y="460" class="body">Run dbt test or dbt build.</text><text x="715" y="482" class="body">Check keys, nulls, ranges.</text><text x="715" y="520" class="why">Why: block unreliable outputs.</text>
  <rect x="370" y="390" width="260" height="170" class="box"/><text x="500" y="425" text-anchor="middle" class="step">7. Analyse</text><text x="395" y="460" class="body">Query marts in Jupyter.</text><text x="395" y="482" class="body">Create metrics and charts.</text><text x="395" y="520" class="why">Why: turn data into evidence.</text>
  <rect x="50" y="390" width="260" height="170" class="box"/><text x="180" y="425" text-anchor="middle" class="step">8. Review and present</text><text x="75" y="460" class="body">Maker opens a small PR.</text><text x="75" y="482" class="body">Lead checks, merges, presents.</text><text x="75" y="520" class="why">Why: maker-checker control.</text>
  <path d="M1140 280 V390" class="arrow"/><path d="M1010 475 H950" class="arrow"/><path d="M690 475 H630" class="arrow"/><path d="M370 475 H310" class="arrow"/>
  <text x="750" y="665" text-anchor="middle" class="step">Repeatable commands</text><text x="750" y="700" text-anchor="middle" class="body">python scripts/ingest.py  →  dbt build --project-dir instacart_dbt  →  open notebooks</text><text x="750" y="730" text-anchor="middle" class="why">Optional later: Meltano wraps the steps; Dagster schedules them; Streamlit presents results.</text>
</svg>
