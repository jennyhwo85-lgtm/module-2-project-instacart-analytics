<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <style>
    .title{font:700 26px Arial;fill:#17324d}.section{font:700 18px Arial;fill:#17324d}.label{font:700 15px Arial;fill:#17324d}.text{font:13px Arial;fill:#263746}.small{font:12px Arial;fill:#425466}.box{stroke:#557086;stroke-width:1.5;rx:10}.raw{fill:#eef3f7}.stage{fill:#e7f4ff}.int{fill:#fff3d6}.mart{fill:#e8f5e9}.output{fill:#f1e9ff}.arrow{stroke:#557086;stroke-width:2;fill:none;marker-end:url(#arrow)}.rel{stroke:#7b8794;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#557086"/></marker></defs>
  <text x="700" y="38" text-anchor="middle" class="title">Instacart ELT Pipeline and Star Schema</text>
  <text x="40" y="80" class="section">Pipeline layers</text>
  <rect x="40" y="100" width="220" height="250" class="box raw"/><text x="150" y="130" text-anchor="middle" class="label">Raw inputs</text><text x="60" y="165" class="text">Six Kaggle CSV files</text><text x="60" y="195" class="small">orders.csv</text><text x="60" y="217" class="small">products.csv</text><text x="60" y="239" class="small">aisles.csv</text><text x="60" y="261" class="small">departments.csv</text><text x="60" y="283" class="small">prior/train order items</text><text x="60" y="325" class="small">Source files are preserved.</text>
  <rect x="315" y="100" width="220" height="250" class="box raw"/><text x="425" y="130" text-anchor="middle" class="label">DuckDB raw layer</text><text x="335" y="170" class="text">Python ingestion script</text><text x="335" y="205" class="small">raw_orders</text><text x="335" y="227" class="small">raw_products</text><text x="335" y="249" class="small">raw_aisles / departments</text><text x="335" y="271" class="small">raw_order_products_*</text><text x="335" y="325" class="small">Rebuildable source-of-truth</text>
  <rect x="590" y="100" width="220" height="250" class="box stage"/><text x="700" y="130" text-anchor="middle" class="label">dbt staging</text><text x="610" y="170" class="text">Views: stg_*</text><text x="610" y="205" class="small">Type casting</text><text x="610" y="227" class="small">Consistent names</text><text x="610" y="249" class="small">Light standardisation</text><text x="610" y="271" class="small">No complex business logic</text><text x="610" y="325" class="small">Preserves source grain</text>
  <rect x="865" y="100" width="220" height="250" class="box int"/><text x="975" y="130" text-anchor="middle" class="label">dbt intermediate</text><text x="885" y="170" class="text">Views: int_*</text><text x="885" y="205" class="small">Union prior + train</text><text x="885" y="227" class="small">Join orders + products</text><text x="885" y="249" class="small">Reusable enrichment</text><text x="885" y="271" class="small">One row per order item</text><text x="885" y="325" class="small">Preparation for marts</text>
  <rect x="1140" y="100" width="220" height="250" class="box mart"/><text x="1250" y="130" text-anchor="middle" class="label">dbt marts</text><text x="1160" y="170" class="text">Persisted analytical tables</text><text x="1160" y="205" class="small">Five dimensions</text><text x="1160" y="227" class="small">One fact table</text><text x="1160" y="249" class="small">dbt tests</text><text x="1160" y="325" class="small">Notebook / dashboard interface</text>
  <path d="M260 225 H315" class="arrow"/><path d="M535 225 H590" class="arrow"/><path d="M810 225 H865" class="arrow"/><path d="M1085 225 H1140" class="arrow"/>
  <text x="40" y="410" class="section">Implemented mart star schema</text>
  <rect x="555" y="545" width="290" height="130" class="box mart"/><text x="700" y="575" text-anchor="middle" class="label">fact_order_items</text><text x="575" y="605" class="small">Grain: one product in one observed order</text><text x="575" y="627" class="small">Keys: order_id, user_id, product_id</text><text x="575" y="649" class="small">Measures: reordered, add_to_cart_order</text>
  <rect x="80" y="455" width="210" height="90" class="box output"/><text x="185" y="485" text-anchor="middle" class="label">dim_users</text><text x="100" y="515" class="small">One row per user</text>
  <rect x="80" y="650" width="210" height="90" class="box output"/><text x="185" y="680" text-anchor="middle" class="label">dim_orders</text><text x="100" y="710" class="small">One row per order</text>
  <rect x="1110" y="455" width="210" height="90" class="box output"/><text x="1215" y="485" text-anchor="middle" class="label">dim_products</text><text x="1130" y="515" class="small">One row per product</text>
  <rect x="1110" y="650" width="210" height="90" class="box output"/><text x="1215" y="680" text-anchor="middle" class="label">dim_aisles</text><text x="1130" y="710" class="small">One row per aisle</text>
  <rect x="870" y="700" width="210" height="90" class="box output"/><text x="975" y="730" text-anchor="middle" class="label">dim_departments</text><text x="890" y="760" class="small">One row per department</text>
  <path d="M290 500 C400 500 450 570 555 590" class="rel"/><path d="M290 695 C420 695 450 645 555 635" class="rel"/><path d="M1110 500 C1000 500 950 570 845 590" class="rel"/><path d="M1110 695 C1000 695 950 645 845 635" class="rel"/><path d="M870 735 C850 700 830 675 810 660" class="rel"/>
</svg>
